apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: default

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'django'
        static_configs:
          - targets: ['smartcampus-web-service:8000']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter-service:9100']