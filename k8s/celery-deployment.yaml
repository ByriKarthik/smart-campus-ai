apiVersion: apps/v1
kind: Deployment

metadata:
  name: celery

spec:
  replicas: 1

  selector:
    matchLabels:
      app: celery

  template:
    metadata:
      labels:
        app: celery

    spec:
      imagePullSecrets:
      - name: dockerhub-secret

      containers:
      - name: celery

        image: karthikbyri/smart-campus-ai:latest

        imagePullPolicy: Always

        workingDir: /app/campus_ai/campus_ai

        command:
          - celery
        args:
          - -A
          - campus_ai.celery
          - worker
          - --loglevel=info

        env:
        - name: DB_NAME
          value: "smartcampus"

        - name: DB_USER
          value: "campusadmin"

        - name: DB_PASSWORD
          value: "campus123"

        - name: DB_HOST
          value: "db"

        - name: DB_PORT
          value: "5432"

        - name: REDIS_HOST
          value: "redis-service"

        - name: REDIS_PORT
          value: "6379"

        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"

        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"