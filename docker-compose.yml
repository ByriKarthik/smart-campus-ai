services:

  db:
    image: postgres:17
    restart: always

    environment:
      POSTGRES_DB: smartcampus
      POSTGRES_USER: campusadmin
      POSTGRES_PASSWORD: campus123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always

    command: gunicorn --bind 0.0.0.0:8000 campus_ai.wsgi:application

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env

  nginx:
    image: nginx:latest
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx:/etc/nginx/conf.d
      - .:/app

    depends_on:
      - web

  redis:
    image: redis:7
    restart: always

    ports:
      - "6379:6379"

  celery:
    build: .
    restart: always

    command: celery -A campus_ai.celery worker --loglevel=info

    volumes:
      - .:/app

    depends_on:
      - redis
      - web

    env_file:
      - .env

  prometheus:
    image: prom/prometheus
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - web

  grafana:
    image: grafana/grafana
    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - web

  node-exporter:
    image: prom/node-exporter
    restart: always

    ports:
      - "9100:9100"

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins

    restart: always
    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project

volumes:
  postgres_data:
  jenkins_home: